<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why You're Special</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: linear-gradient(to bottom, #ffd9d9 0%, #ffb3b3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }
        h1 {
            font-size: 45px;
            color: #ff9a9e;
            margin-bottom: 40px;
            animation: fadeIn 2s forwards;
            opacity: 0;
        }
        .reasons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
        }
        .reason-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.2);
            width: 250px;
            text-align: center;
            font-size: 20px;
            color: #5c4d68;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s;
        }
        .reason-card:hover {
            transform: translateY(-10px) scale(1.05) !important;
            box-shadow: 0 15px 40px rgba(255, 154, 158, 0.4);
        }
        
        @keyframes popIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn-next {
            margin-top: 50px;
            opacity: 0;
            animation: fadeIn 2s forwards 5s;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="hearts"></div>
    
    <h1>Because you are...</h1>
    
    <div class="reasons-container">
        <div class="reason-card" style="animation: popIn 1s forwards 1s;">
            💖<br><br>Incredibly kind and caring
        </div>
        <div class="reason-card" style="animation: popIn 1s forwards 2s;">
            ✨<br><br>My favorite smile in the world
        </div>
        <div class="reason-card" style="animation: popIn 1s forwards 3s;">
            🌟<br><br>The one who makes everything brighter
        </div>
    </div>
    
    <button class="btn-next" onclick="nextPage()">I wrote you something 💌</button>

    <script src="../js/cursor.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sender = params.get("from");
        const receiver = params.get("to");
        
        // Add floating hearts
        const heartsContainer = document.querySelector('.hearts');
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('span');
            heart.innerText = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartsContainer.appendChild(heart);
        }

        function nextPage() {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = `letter.html?from=${encodeURIComponent(sender)}&to=${encodeURIComponent(receiver)}`;
            }, 1000);
        }
    </script>
</body>
</html>
