<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Universe of Stars</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: linear-gradient(to bottom, #ffd9d9 0%, #ffb3b3 100%);
            color: #5c4d68;
            transition: background 2s ease;
        }
        .text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            z-index: 10;
        }
        h1 {
            font-size: 50px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInOut 5s forwards;
        }
        .stars span {
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.9); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="stars" id="galaxy"></div>

    <div class="text-container">
        <h1 id="universe-text">And an infinite universe of stars...</h1>
    </div>

    <script src="../js/cursor.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sender = params.get("from");
        const receiver = params.get("to");
        
        // Generate a dense galaxy
        const galaxy = document.getElementById('galaxy');
        for (let i = 0; i < 200; i++) {
            let star = document.createElement('span');
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            // Center clustering
            let size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            galaxy.appendChild(star);
        }

        const texts = [
            "And an infinite universe of stars...",
            "But among all of them...",
            "There's only one that shines the brightest for me."
        ];
        
        const textElement = document.getElementById('universe-text');
        let currentIndex = 0;

        textElement.addEventListener('animationend', (e) => {
            if (e.animationName === 'fadeInOut') {
                currentIndex++;
                if (currentIndex < texts.length) {
                    textElement.innerText = texts[currentIndex];
                    textElement.style.animation = 'none';
                    textElement.offsetHeight; /* trigger reflow */
                    textElement.style.animation = 'fadeInOut 5s forwards';
                } else {
                    // Transition to next page
                    document.body.style.opacity = "0";
                    setTimeout(() => {
                        window.location.href = `search.html?from=${encodeURIComponent(sender)}&to=${encodeURIComponent(receiver)}`;
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
