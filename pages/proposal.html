<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question...</title>
    <link rel="stylesheet" href="../css/proposal.css">
</head>
<body>
    <div class="stars"></div>
    <div class="background-hearts"></div>

    <div class="container fade-in">
        <div class="image-container">
            <img src="../assets/teddy_bear.jpg" id="main-image" alt="Teddy Bear with Flowers">
        </div>
        
        <p class="subtitle" id="subtitle-text">I have a very important question to ask you.</p>
        <h1 id="question">Hey <span id="receiver-name">there</span>...</h1>

        <div class="buttons" id="buttons-container">
            <button class="btn btn-yes" id="btn-yes" onclick="sayYes()">Yes! ❤️</button>
            <button class="btn btn-no" id="btn-no" onmouseover="moveNoButton()" onclick="moveNoButton()">No 💔</button>
        </div>
        
        <div class="hidden-message" id="hidden-message" style="display:none;">
            <h2>YAYYYY! I knew you'd say YES! ❤️</h2>
            <p>You've made <span id="sender-name">me</span> the happiest person in the universe!</p>
        </div>
    </div>

    <script src="../js/cursor.js"></script>
    <script src="../js/proposal.js"></script>
</body>
</html>
