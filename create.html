<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Story</title>

<link rel="stylesheet" href="css/create.css">

</head>


<body>


<div class="stars"></div>


<div class="container">


<h1>
Create Your Universe ✨
</h1>


<p>
Every beautiful story begins with two names.
</p>



<div class="card">


<label>
Your Name
</label>

<input 
id="sender"
placeholder="Enter your name">


<label>
Their Name
</label>

<input 
id="receiver"
placeholder="Enter their name">



<label for="story">
Choose Story
</label>


<select id="story">

<option value="proposal">
Proposal 💍
</option>

<option value="love">
Love Letter ❤️
</option>

<option value="anniversary">
Anniversary 🌹
</option>

<option value="special">
Just Because ✨
</option>

</select>


<button onclick="createStory()">

Create Our Universe 🌌

</button>


</div>


</div>



<script src="js/cursor.js"></script>
<script src="js/create.js"></script>


</body>

</html>
